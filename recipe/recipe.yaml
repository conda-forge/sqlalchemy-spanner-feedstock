schema_version: 1

context:
  name: sqlalchemy-spanner
  version: 1.21.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlalchemy_spanner-${{ version }}.tar.gz
  sha256: f906cf9657d5e1f1afbd2f867df8812c2fbc9d36479db91bc3c3592d7415e2a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.1.13,<3.0.0
    - google-cloud-spanner >=3.55.0
    - alembic >=1.0.0,<2.0.0
tests:
  - python:
      imports:
        - google.cloud.sqlalchemy_spanner
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - pip check

about:
  summary: SQLAlchemy dialect integrated into Cloud Spanner database
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/sqlalchemy-spanner

extra:
  recipe-maintainers:
    - xylar
